[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flydreamer"
version = "3.3.1"
description = "JAX-based FPV world model training (DreamerV3 fork)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Danijar Hafner", email = "mail@danijar.com"},
]
keywords = ["reinforcement-learning", "world-models", "jax", "fpv", "drone"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ale_py>=0.9.0",
    "autorom[accept-rom-license]>=0.6.1",
    "av",
    "chex",
    "colored_traceback",
    "einops",
    "elements>=3.19.1",
    "google-resumable-media>=2.7.2",
    "granular>=0.20.3",
    "ipdb",
    "jax[cuda12]>=0.4.33",
    "jaxtyping",
    "ninjax>=3.5.1",
    "numpy<2",
    "nvidia-cuda-nvcc-cu12<=12.2",
    "optax",
    "portal==3.5.0",
    "scope>=0.4.4",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ipython",
]
fpv = [
    "dm-control",
    "mujoco",
]
ci = [
    "pyyaml",
    "pytest",
    "ruff",
]

[project.scripts]
flydreamer = "dreamerv3.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dreamerv3*", "embodied*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["embodied/tests"]
